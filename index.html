<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Học Kana & Từ vựng</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            text-align: center;
            padding: 20px;
        }

        select,
        button {
            margin: 5px;
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            cursor: pointer;
            font-weight: bold;
            color: #000;
        }

        .card-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .card {
            width: 250px;
            height: 200px;
            background: var(--card);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--text);
        }

        .card:hover {
            transform: scale(1.05);
        }

        .controls {
            margin-top: 20px;
        }

        /* Styles for Quiz Mode */
        #flashcard-container,
        #quiz-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
            width: 100%;
            max-width: 500px;
        }

        .quiz-btn {
            background: var(--card);
            color: var(--text);
            padding: 20px 10px;
            font-size: 20px;
            border-radius: 12px;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .quiz-btn:hover:not(:disabled) {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .quiz-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .result {
            margin-top: 20px;
            font-size: 22px;
            height: 80px;
        }

        #quiz-question {
            font-size: 32px;
            text-align: center;
            padding: 10px 30px;
            cursor: default;
        }

        /* Writing mode styles */
        #writing-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .writing-prompt {
            font-size: 36px;
            font-weight: bold;
            color: var(--accent);
            margin: 20px 0 10px;
        }

        .writing-hint {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .writing-input {
            width: 100%;
            max-width: 400px;
            padding: 16px 20px;
            font-size: 24px;
            border-radius: 12px;
            border: 2px solid #334155;
            background: var(--card);
            color: var(--text);
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .writing-input:focus {
            border-color: var(--accent);
        }

        .writing-input.correct {
            border-color: var(--success);
            background: #14532d33;
        }

        .writing-input.wrong {
            border-color: var(--danger);
            background: #7f1d1d33;
        }

        .writing-submit {
            margin-top: 15px;
            background: var(--accent);
            color: #000;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .writing-submit:hover {
            transform: scale(1.05);
        }

        .writing-score {
            margin-top: 15px;
            font-size: 16px;
            color: #94a3b8;
        }

        .writing-correct-answer {
            margin-top: 10px;
            font-size: 20px;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <h1>Học Tiếng Nhật 🇯🇵🧠</h1>

    <select id="modeSelect" onchange="changeMode()" style="font-size: 16px; padding: 10px;">
        <option value="katakana">Katakana</option>
        <option value="hiragana">Hiragana</option>
        <option value="both">Cả hai Kara</option>
        <option value="quiz">Trắc nghiệm Từ vựng</option>
        <option value="writing">Tự viết Từ vựng ✍️</option>
        <option value="datetime">Viết Thứ/Ngày/Phút 📅</option>
    </select>

    <div id="flashcard-container">
        <div class="card-container">
            <div class="card" id="card" onclick="flipCard()">あ</div>
        </div>

        <div class="controls">
            <button onclick="prevCard()">⬅</button>
            <button onclick="shuffleAndReset()" title="Trộn ngẫu nhiên (Xáo trộn)">🔀</button>
            <button onclick="nextCard()">➡</button>
        </div>
    </div>

    <div id="quiz-container" style="display: none;">
        <div class="card-container">
            <div id="quiz-question" class="card"></div>
        </div>

        <div id="quiz-options" class="options-grid">
            <button class="quiz-btn" onclick="checkAnswer(0)"></button>
            <button class="quiz-btn" onclick="checkAnswer(1)"></button>
            <button class="quiz-btn" onclick="checkAnswer(2)"></button>
            <button class="quiz-btn" onclick="checkAnswer(3)"></button>
        </div>

        <div id="quiz-result" class="result"></div>
        <button id="next-quiz-btn" onclick="nextQuizQuestion()"
            style="display: none; background: var(--success); color: white; padding: 12px 24px; font-size: 18px;">Câu
            tiếp theo ➡</button>
    </div>

    <div id="writing-container">
        <div class="card-container">
            <div class="card" id="writing-question" style="font-size:28px; cursor:default;"></div>
        </div>
        <p class="writing-hint">Gõ bằng Hiragana, Katakana hoặc phiên âm Romaji</p>
        <input type="text" id="writing-input" class="writing-input" placeholder="Nhập tiếng Nhật..." autocomplete="off" />
        <button class="writing-submit" id="writing-submit-btn" onclick="checkWritingAnswer()">Kiểm tra ✅</button>
        <div id="writing-result" class="result"></div>
        <div id="writing-correct" class="writing-correct-answer"></div>
        <div id="writing-score" class="writing-score"></div>
        <button id="next-writing-btn" onclick="nextWritingQuestion()" style="display:none; background: var(--success); color: white; padding: 12px 24px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; margin-top:10px;">Câu tiếp theo ➡</button>
    </div>

    <div id="datetime-container" style="display:none; flex-direction:column; align-items:center; width:100%;">
        <div style="margin: 15px 0;">
            <button class="dt-cat-btn" onclick="setDtCategory('days')" id="dt-cat-days" style="background:var(--accent);color:#000;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;margin:3px;">Thứ trong tuần</button>
            <button class="dt-cat-btn" onclick="setDtCategory('dates')" id="dt-cat-dates" style="background:var(--card);color:var(--text);padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;margin:3px;">Ngày trong tháng</button>
            <button class="dt-cat-btn" onclick="setDtCategory('minutes')" id="dt-cat-minutes" style="background:var(--card);color:var(--text);padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;margin:3px;">Số phút</button>
            <button class="dt-cat-btn" onclick="setDtCategory('all')" id="dt-cat-all" style="background:var(--card);color:var(--text);padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:bold;margin:3px;">Tất cả</button>
        </div>
        <div class="card-container">
            <div class="card" id="dt-question" style="font-size:24px; cursor:default;"></div>
        </div>
        <p class="writing-hint">Gõ bằng Hiragana, Katakana hoặc phiên âm Romaji</p>
        <input type="text" id="dt-input" class="writing-input" placeholder="Nhập tiếng Nhật..." autocomplete="off" />
        <button class="writing-submit" id="dt-submit-btn" onclick="checkDtAnswer()">Kiểm tra ✅</button>
        <div id="dt-result" class="result"></div>
        <div id="dt-correct" class="writing-correct-answer"></div>
        <div id="dt-score" class="writing-score"></div>
        <button id="next-dt-btn" onclick="nextDtQuestion()" style="display:none; background: var(--success); color: white; padding: 12px 24px; font-size: 18px; border-radius: 8px; border: none; cursor: pointer; margin-top:10px;">Câu tiếp theo ➡</button>
    </div>

    <script>
        // === KANA LOGIC ===
        const hiragana = [
            { char: "あ", romaji: "a" }, { char: "い", romaji: "i" }, { char: "う", romaji: "u" }, { char: "え", romaji: "e" }, { char: "お", romaji: "o" },
            { char: "か", romaji: "ka" }, { char: "き", romaji: "ki" }, { char: "く", romaji: "ku" }, { char: "け", romaji: "ke" }, { char: "こ", romaji: "ko" },
            { char: "さ", romaji: "sa" }, { char: "し", romaji: "shi" }, { char: "す", romaji: "su" }, { char: "せ", romaji: "se" }, { char: "そ", romaji: "so" },
            { char: "た", romaji: "ta" }, { char: "ち", romaji: "chi" }, { char: "つ", romaji: "tsu" }, { char: "て", romaji: "te" }, { char: "と", romaji: "to" },
            { char: "な", romaji: "na" }, { char: "に", romaji: "ni" }, { char: "ぬ", romaji: "nu" }, { char: "ね", romaji: "ne" }, { char: "の", romaji: "no" },
            { char: "は", romaji: "ha" }, { char: "ひ", romaji: "hi" }, { char: "ふ", romaji: "fu" }, { char: "へ", romaji: "he" }, { char: "ほ", romaji: "ho" },
            { char: "ま", romaji: "ma" }, { char: "み", romaji: "mi" }, { char: "む", romaji: "mu" }, { char: "め", romaji: "me" }, { char: "も", romaji: "mo" },
            { char: "や", romaji: "ya" }, { char: "ゆ", romaji: "yu" }, { char: "よ", romaji: "yo" },
            { char: "ら", romaji: "ra" }, { char: "り", romaji: "ri" }, { char: "る", romaji: "ru" }, { char: "れ", romaji: "re" }, { char: "ろ", romaji: "ro" },
            { char: "わ", romaji: "wa" }, { char: "を", romaji: "wo" }, { char: "ん", romaji: "n" }
        ];

        const katakana = [
            { char: "ア", romaji: "a" }, { char: "イ", romaji: "i" }, { char: "ウ", romaji: "u" }, { char: "エ", romaji: "e" }, { char: "オ", romaji: "o" },
            { char: "カ", romaji: "ka" }, { char: "キ", romaji: "ki" }, { char: "ク", romaji: "ku" }, { char: "ケ", romaji: "ke" }, { char: "コ", romaji: "ko" },
            { char: "サ", romaji: "sa" }, { char: "シ", romaji: "shi" }, { char: "ス", romaji: "su" }, { char: "セ", romaji: "se" }, { char: "ソ", romaji: "so" },
            { char: "タ", romaji: "ta" }, { char: "チ", romaji: "chi" }, { char: "ツ", romaji: "tsu" }, { char: "テ", romaji: "te" }, { char: "ト", romaji: "to" },
            { char: "ナ", romaji: "na" }, { char: "ニ", romaji: "ni" }, { char: "ヌ", romaji: "nu" }, { char: "ネ", romaji: "ne" }, { char: "ノ", romaji: "no" },
            { char: "ハ", romaji: "ha" }, { char: "ヒ", romaji: "hi" }, { char: "フ", romaji: "fu" }, { char: "ヘ", romaji: "he" }, { char: "ホ", romaji: "ho" },
            { char: "マ", romaji: "ma" }, { char: "ミ", romaji: "mi" }, { char: "ム", romaji: "mu" }, { char: "メ", romaji: "me" }, { char: "モ", romaji: "mo" },
            { char: "ヤ", romaji: "ya" }, { char: "ユ", romaji: "yu" }, { char: "ヨ", romaji: "yo" },
            { char: "ラ", romaji: "ra" }, { char: "リ", romaji: "ri" }, { char: "ル", romaji: "ru" }, { char: "レ", romaji: "re" }, { char: "ロ", romaji: "ro" },
            { char: "ワ", romaji: "wa" }, { char: "ヲ", romaji: "wo" }, { char: "ン", romaji: "n" }
        ];

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        let currentSet = [...katakana];
        shuffleArray(currentSet);
        let index = 0;
        let flipped = false;

        function shuffleAndReset() {
            shuffleArray(currentSet);
            index = 0;
            renderCard();
        }

        function renderCard() {
            const card = document.getElementById("card");
            flipped = false;
            card.textContent = currentSet[index].char;
        }

        function flipCard() {
            const card = document.getElementById("card");
            flipped = !flipped;
            card.textContent = flipped ? currentSet[index].romaji : currentSet[index].char;
        }

        function nextCard() {
            index = (index + 1) % currentSet.length;
            renderCard();
        }

        function prevCard() {
            index = (index - 1 + currentSet.length) % currentSet.length;
            renderCard();
        }

        // === QUIZ LOGIC ===
        const quizVocabulary = [
            // Từ vựng 1
            { jp: "私 (watashi)", vn: "Tôi" },
            { jp: "名前 (namae)", vn: "Tên" },
            { jp: "国 (kuni)", vn: "Đất nước" },
            { jp: "日本 (nihon)", vn: "Nhật Bản" },
            { jp: "アメリカ (amerika)", vn: "Mỹ" },
            { jp: "韓国 (kankoku)", vn: "Hàn Quốc" },
            { jp: "学校 (gakkou)", vn: "Trường học" },
            { jp: "仕事 (shigoto)", vn: "Công việc" },
            { jp: "学生 (gakusei)", vn: "Học sinh/Sinh viên" },
            { jp: "先生 (sensei)", vn: "Giáo viên" },
            { jp: "会社員 (kaishain)", vn: "Nhân viên công ty" },
            { jp: "誕生日 (tanjoubi)", vn: "Sinh nhật" },
            { jp: "いつ (itsu)", vn: "Khi nào" },
            { jp: "趣味 (shumi)", vn: "Sở thích" },
            { jp: "スポーツ (supo-tsu)", vn: "Thể thao" },
            { jp: "映画 (eiga)", vn: "Phim ảnh" },
            { jp: "読書 (dokusho)", vn: "Đọc sách" },
            { jp: "料理 (ryouri)", vn: "Nấu ăn" },
            { jp: "何 (nani)", vn: "Cái gì" },

            // Từ vựng 2
            { jp: "ここ (koko)", vn: "Ở đây" },
            { jp: "そこ (soko)", vn: "Ở đó" },
            { jp: "あそこ (asoko)", vn: "Ở kia" },
            { jp: "トイレ (toire)", vn: "Nhà vệ sinh" },
            { jp: "スーパー (su-pa-)", vn: "Siêu thị" },
            { jp: "レストラン (resutoran)", vn: "Nhà hàng" },
            { jp: "携帯電話 (keitaidenwa)", vn: "Điện thoại di động" },
            { jp: "パソコン (pasokon)", vn: "Máy tính cá nhân" },
            { jp: "本 (hon)", vn: "Sách" },
            { jp: "水 (mizu)", vn: "Nước" },
            { jp: "どこ (doko)", vn: "Ở đâu" },
            { jp: "これ (kore)", vn: "Cái này" },
            { jp: "それ (sore)", vn: "Cái đó" },
            { jp: "あれ (are)", vn: "Cái kia" },
            { jp: "かばん (kaban)", vn: "Cặp/Túi" },
            { jp: "時計 (tokei)", vn: "Đồng hồ" },
            { jp: "いくら (ikura)", vn: "Bao nhiêu tiền" },
            { jp: "肉 (niku)", vn: "Thịt" },
            { jp: "魚 (sakana)", vn: "Cá" },
            { jp: "野菜 (yasai)", vn: "Rau" },
            { jp: "ご飯 (gohan)", vn: "Cơm" },
            { jp: "コーヒー (ko-hi-)", vn: "Cà phê" },
            { jp: "誰 (dare)", vn: "Ai" },

            // Từ vựng 3
            { jp: "今 (ima)", vn: "Bây giờ" },
            { jp: "時間 (jikan)", vn: "Thời gian" },
            { jp: "休み (yasumi)", vn: "Ngày nghỉ" },
            { jp: "病院 (byouin)", vn: "Bệnh viện" },
            { jp: "公園 (kouen)", vn: "Công viên" },
            { jp: "海 (umi)", vn: "Biển" },
            { jp: "お酒 (osake)", vn: "Rượu" },
            { jp: "行きます (ikimasu)", vn: "Đi" },
            { jp: "帰ります (kaerimasu)", vn: "Về" },
            { jp: "飲みます (nomimasu)", vn: "Uống" },
            { jp: "食べます (tabemasu)", vn: "Ăn" },
            { jp: "見ます (mimasu)", vn: "Xem/Nhìn" },
            { jp: "します (shimasu)", vn: "Làm/Chơi" },
            { jp: "朝 (asa)", vn: "Sáng" },
            { jp: "夜 (yoru)", vn: "Tối" },
            { jp: "毎日 (mainichi)", vn: "Mọi ngày" },
            { jp: "買います (kaimasu)", vn: "Mua" },
            { jp: "聞きます (kikimasu)", vn: "Nghe" },
            { jp: "働きます (hatarakimasu)", vn: "Làm việc" },
            { jp: "読みます (yomimasu)", vn: "Đọc" },
            { jp: "起きます (okimasu)", vn: "Thức dậy" },
            { jp: "寝ます (nemasu)", vn: "Ngủ" },
            { jp: "勉強します (benkyoushimasu)", vn: "Học" },
            { jp: "来ます (kimasu)", vn: "Đến" }
        ];

        let quizQueue = [];
        let currentQuizWord = null;
        let currentOptions = [];
        let isAnswered = false;

        function startQuiz() {
            quizQueue = [...quizVocabulary];
            shuffleArray(quizQueue);
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            document.getElementById('next-quiz-btn').style.display = "none";
            document.getElementById('quiz-result').innerHTML = "";

            if (quizQueue.length === 0) {
                document.getElementById('quiz-question').textContent = "Hoàn thành!";
                document.getElementById('quiz-result').innerHTML = "<span style='color: var(--success); font-weight:bold;'>Tuyệt vời! Bạn đã học xong tất cả từ vựng!</span>";
                document.getElementById('quiz-options').style.display = "none";
                return;
            }

            document.getElementById('quiz-options').style.display = "grid";
            isAnswered = false;
            currentQuizWord = quizQueue.shift();

            // Lấy 3 đáp án sai ngẫu nhiên
            let tempVocab = quizVocabulary.filter(v => v.jp !== currentQuizWord.jp);
            shuffleArray(tempVocab);
            let wrongOptions = tempVocab.slice(0, 3);

            // Gộp và xáo trộn 4 đáp án
            currentOptions = [currentQuizWord, ...wrongOptions];
            shuffleArray(currentOptions);

            // Hiển thị câu hỏi
            document.getElementById('quiz-question').textContent = currentQuizWord.vn;

            // Gán giá trị vào 4 nút
            const btns = document.querySelectorAll('.quiz-btn');
            btns.forEach((btn, index) => {
                btn.textContent = currentOptions[index].jp;
                btn.style.backgroundColor = "var(--card)";
                btn.style.color = "var(--text)";
                btn.disabled = false;
            });
        }

        function checkAnswer(selectedIndex) {
            if (isAnswered) return;
            isAnswered = true;

            const btns = document.querySelectorAll('.quiz-btn');
            const selectedBtn = btns[selectedIndex];
            const selectedWord = currentOptions[selectedIndex];
            const resultDiv = document.getElementById('quiz-result');

            // Tìm nút chứa đáp án đúng
            let correctIndex = currentOptions.findIndex(v => v.jp === currentQuizWord.jp);
            const correctBtn = btns[correctIndex];

            if (selectedWord.jp === currentQuizWord.jp) {
                // Trả lời ĐÚNG
                selectedBtn.style.backgroundColor = "var(--success)"; // Màu xanh
                selectedBtn.style.color = "#fff";
                resultDiv.innerHTML = `<span style='color: var(--success); font-weight:bold;'>Chính xác!</span><br>${currentQuizWord.jp} - ${currentQuizWord.vn}`;

                // Tự động chuyển câu sau 1.5 giây
                setTimeout(() => {
                    if (document.getElementById("modeSelect").value === "quiz") {
                        nextQuizQuestion();
                    }
                }, 1500);
            } else {
                // Trả lời SAI
                selectedBtn.style.backgroundColor = "var(--danger)"; // Màu đỏ
                selectedBtn.style.color = "#fff";
                correctBtn.style.backgroundColor = "var(--success)"; // Làm nổi bật đáp án đúng
                correctBtn.style.color = "#fff";

                resultDiv.innerHTML = `<span style='color: var(--danger); font-weight:bold;'>Sai rồi!</span><br>Đáp án đúng là: ${currentQuizWord.jp} - ${currentQuizWord.vn}`;

                // Chèn câu chọn sai vào lại mảng để làm lại (ngẫu nhiên từ vị trí 2 đến 5)
                let insertPos = Math.min(quizQueue.length, Math.floor(Math.random() * 3) + 2);
                quizQueue.splice(insertPos, 0, currentQuizWord);

                // Hiện nút "Tiếp theo"
                document.getElementById('next-quiz-btn').style.display = "inline-block";
            }

            // Khóa tất cả các nút
            btns.forEach(btn => {
                btn.disabled = true;
                if (btn.style.backgroundColor === "var(--card)") {
                    btn.style.opacity = "0.5";
                }
            });
        }

        // === WRITING MODE LOGIC ===
        let writingQueue = [];
        let currentWritingWord = null;
        let writingCorrect = 0;
        let writingTotal = 0;
        let writingAnswered = false;

        function extractRomaji(jpStr) {
            const match = jpStr.match(/\(([^)]+)\)/);
            return match ? match[1].trim().toLowerCase() : '';
        }

        function extractKana(jpStr) {
            // Extract all hiragana and katakana characters
            const kana = jpStr.match(/[\u3040-\u309F\u30A0-\u30FF\u30FC]+/g);
            return kana ? kana.join('') : '';
        }

        function extractKanji(jpStr) {
            // Get the part before the parentheses
            const before = jpStr.split('(')[0].trim();
            return before;
        }

        function normalizeInput(str) {
            return str.trim().toLowerCase()
                .replace(/[\s\-ー]/g, '')
                .replace(/ou/g, 'o')
                .replace(/uu/g, 'u');
        }

        function checkWritingMatch(userInput, word) {
            const input = normalizeInput(userInput);
            if (!input) return false;

            // Check against romaji
            const romaji = normalizeInput(extractRomaji(word.jp));
            if (romaji && input === romaji) return true;

            // Check against kana
            const kana = extractKana(word.jp);
            if (kana && input === kana) return true;

            // Check against kanji part
            const kanji = extractKanji(word.jp).replace(/\s/g, '');
            if (kanji && input === kanji) return true;

            // Check full jp string without spaces
            if (input === word.jp.replace(/\s/g, '').toLowerCase()) return true;

            return false;
        }

        function startWriting() {
            writingQueue = [...quizVocabulary];
            shuffleArray(writingQueue);
            writingCorrect = 0;
            writingTotal = 0;
            nextWritingQuestion();
        }

        function nextWritingQuestion() {
            document.getElementById('next-writing-btn').style.display = 'none';
            document.getElementById('writing-result').innerHTML = '';

            const input = document.getElementById('writing-input');
            input.value = '';
            input.className = 'writing-input';
            input.disabled = false;
            input.focus();
            document.getElementById('writing-submit-btn').disabled = false;
            writingAnswered = false;

            if (writingQueue.length === 0) {
                document.getElementById('writing-question').textContent = '🎉 Hoàn thành!';
                document.getElementById('writing-result').innerHTML = `<span style='color:var(--success);font-weight:bold;'>Tuyệt vời! Bạn đúng ${writingCorrect}/${writingTotal} câu!</span>`;
                input.style.display = 'none';
                document.getElementById('writing-submit-btn').style.display = 'none';
                return;
            }

            input.style.display = '';
            document.getElementById('writing-submit-btn').style.display = '';
            currentWritingWord = writingQueue.shift();
            document.getElementById('writing-question').textContent = currentWritingWord.vn;
            updateWritingScore();
        }

        function updateWritingScore() {
            document.getElementById('writing-score').textContent = `Đúng: ${writingCorrect}/${writingTotal} | Còn lại: ${writingQueue.length + 1}`;
        }

        function checkWritingAnswer() {
            if (writingAnswered) return;
            writingAnswered = true;
            writingTotal++;

            const input = document.getElementById('writing-input');
            const userAnswer = input.value;
            const resultDiv = document.getElementById('writing-result');
            const correctDiv = document.getElementById('writing-correct');

            input.disabled = true;
            document.getElementById('writing-submit-btn').disabled = true;

            if (checkWritingMatch(userAnswer, currentWritingWord)) {
                writingCorrect++;
                input.className = 'writing-input correct';
                resultDiv.innerHTML = `<span style='color:var(--success);font-weight:bold;'>✅ Chính xác!</span>`;
                correctDiv.innerHTML = `${currentWritingWord.jp} = ${currentWritingWord.vn}`;
                setTimeout(() => {
                    if (document.getElementById('modeSelect').value === 'writing') {
                        nextWritingQuestion();
                    }
                }, 1500);
            } else {
                input.className = 'writing-input wrong';
                resultDiv.innerHTML = `<span style='color:var(--danger);font-weight:bold;'>❌ Sai rồi!</span>`;
                correctDiv.innerHTML = `Đáp án: <strong>${currentWritingWord.jp}</strong> = ${currentWritingWord.vn}`;
                let insertPos = Math.min(writingQueue.length, Math.floor(Math.random() * 3) + 2);
                writingQueue.splice(insertPos, 0, currentWritingWord);
                document.getElementById('next-writing-btn').style.display = 'inline-block';
            }
            updateWritingScore();
        }

        document.addEventListener('DOMContentLoaded', () => {

        let dtQueue = [];
        let currentDtWord = null;
        let dtCorrectCount = 0;
        let dtTotalCount = 0;
        let dtAnswered = false;
        let dtCategory = 'days';

        function setDtCategory(cat) {
            dtCategory = cat;
            ['days','dates','minutes','all'].forEach(c => {
                const btn = document.getElementById('dt-cat-' + c);
                btn.style.background = (c === cat) ? 'var(--accent)' : 'var(--card)';
                btn.style.color = (c === cat) ? '#000' : 'var(--text)';
            });
            startDt();
        }

        function getDtData() {
            if (dtCategory === 'days') return [...dtDays];
            if (dtCategory === 'dates') return [...dtDates];
            if (dtCategory === 'minutes') return [...dtMinutes];
            return [...dtDays, ...dtDates, ...dtMinutes];
        }

        function startDt() {
            dtQueue = getDtData();
            shuffleArray(dtQueue);
            dtCorrectCount = 0;
            dtTotalCount = 0;
            nextDtQuestion();
        }

        function nextDtQuestion() {
            document.getElementById('next-dt-btn').style.display = 'none';
            document.getElementById('dt-result').innerHTML = '';
            document.getElementById('dt-correct').innerHTML = '';
            const input = document.getElementById('dt-input');
            input.value = '';
            input.className = 'writing-input';
            input.disabled = false;
            input.focus();
            document.getElementById('dt-submit-btn').disabled = false;
            dtAnswered = false;

            if (dtQueue.length === 0) {
                document.getElementById('dt-question').textContent = '🎉 Hoàn thành!';
                document.getElementById('dt-result').innerHTML = `<span style='color:var(--success);font-weight:bold;'>Tuyệt vời! Bạn đúng ${dtCorrectCount}/${dtTotalCount} câu!</span>`;

                document.getElementById('dt-submit-btn').style.display = 'none';
                return;

            input.style.display = '';
            document.getElementById('dt-submit-btn').style.display = '';
            currentDtWord = dtQueue.shift();
            document.getElementById('dt-question').textContent = currentDtWord.vn;
            updateDtScore();
        }

        function updateDtScore() {
            document.getElementById('dt-score').textContent = `Đúng: ${dtCorrectCount}/${dtTotalCount} | Còn lại: ${dtQueue.length + 1}`;

        function checkDtAnswer() {
            if (dtAnswered) return;

            dtTotalCount++;

            const input = document.getElementById('dt-input');
            const userAnswer = input.value.trim().toLowerCase().replace(/[\s\-ー]/g, '');
            const resultDiv = document.getElementById('dt-result');
            const correctDiv = document.getElementById('dt-correct');

            input.disabled = true;
            document.getElementById('dt-submit-btn').disabled = true;

            const isCorrect = currentDtWord.accepts.some(a => a.toLowerCase().replace(/[\s\-ー]/g, '') === userAnswer);

            if (isCorrect) {
                dtCorrectCount++;
                input.className = 'writing-input correct';
                resultDiv.innerHTML = `<span style='color:var(--success);font-weight:bold;'>✅ Chính xác!</span>`;
                correctDiv.innerHTML = `${currentDtWord.vn} = ${currentDtWord.jp}`;
                setTimeout(() => {
                    if (document.getElementById('modeSelect').value === 'datetime') {
                        nextDtQuestion();
                    }
                }, 1500);
            } else {
                input.className = 'writing-input wrong';
                resultDiv.innerHTML = `<span style='color:var(--danger);font-weight:bold;'>❌ Sai rồi!</span>`;

                dtQueue.splice(insertPos, 0, currentDtWord);
                document.getElementById('next-dt-btn').style.display = 'inline-block';
            }
            updateDtScore();
        }

        // === ROOT LOGIC ===
        function changeMode() {
            const mode = document.getElementById("modeSelect").value;

            document.getElementById('flashcard-container').style.display = 'none';
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('writing-container').style.display = 'none';
            document.getElementById('datetime-container').style.display = 'none';

            if (mode === "quiz") {
                document.getElementById('quiz-container').style.display = 'flex';
                startQuiz();
            } else if (mode === "writing") {
                document.getElementById('writing-container').style.display = 'flex';
                startWriting();
            } else if (mode === "datetime") {
                document.getElementById('datetime-container').style.display = 'flex';
                startDt();
            } else {
                document.getElementById('flashcard-container').style.display = 'flex';

                if (mode === "hiragana") currentSet = [...hiragana];
                else if (mode === "katakana") currentSet = [...katakana];
                else currentSet = [...hiragana, ...katakana];
                shuffleArray(currentSet);
                index = 0;
                renderCard();
            }
        }

        renderCard();
